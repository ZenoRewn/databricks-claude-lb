# ⚠️ 此文件是模板。实际部署时：
#   1) 复制为 secret.yaml（已被 .gitignore 应再次 ignore；千万别 git add）
#   2) 把所有 REPLACE_ME 替换为真实值
#   3) kubectl apply -f secret.yaml
#
# 或用 kubectl create 命令式生成：
#   kubectl create secret generic claude-lb-upstream-credentials \
#     --from-literal=LB_API_KEY=sk-xxx \
#     --from-literal=ADB_TOKEN_CENTRALUS_ADB_WS=dapi_xxx \
#     ... \
#     -n <namespace>
#
# **键名不要手敲**：它们必须与 ConfigMap 里的 ${...} 引用逐字一致，而「名字拼错」是
# 这套注入方式的首要失败模式。按端点名生成两侧（见 configmap.yaml 顶部的约定），
# 并在动生产前用一个短期校验 Pod 跑一遍 `load_config` —— 自 2026-10-18 起，解析不出来
# 的引用会**拒绝启动**而不是静默 401，而单副本下拒绝启动就是停服。
#   kubectl create secret generic claude-lb-copilot-cache \
#     --from-file=copilot-auth-gh-account-1.json=$HOME/.config/databricks-claude-lb/copilot-auth-gh-account-1.json \
#     -n <namespace>

---
apiVersion: v1
kind: Secret
metadata:
  name: claude-lb-upstream-credentials
  labels:
    app: claude-lb
type: Opaque
stringData:
  # 客户端调用本服务时使用的 API key
  LB_API_KEY: REPLACE_ME

  # Databricks tokens（每个 workspace 一个；键名 = ADB_TOKEN_<端点名大写>）
  ADB_TOKEN_CENTRALUS_ADB_WS: REPLACE_ME
  ADB_TOKEN_EASTUS_ADB_WS: REPLACE_ME
  ADB_TOKEN_EASTUS2_ADB_WS: REPLACE_ME
  ADB_TOKEN_NORTHCENTRALUS_ADB_WS: REPLACE_ME
  ADB_TOKEN_SOUTHCENTRALUS_ADB_WS: REPLACE_ME
  ADB_TOKEN_WESTUS_ADB_WS: REPLACE_ME
  ADB_TOKEN_AUSTRALIAEAST_ADB_WS: REPLACE_ME
  ADB_TOKEN_CANADACENTRAL_ADB_WS: REPLACE_ME
  ADB_TOKEN_JAPANEAST_ADB_WS: REPLACE_ME

  # Azure OpenAI keys（gpt 那一面）
  AZURE_OPENAI_KEY_EASTUS2_AZURE_AI: REPLACE_ME
  AZURE_OPENAI_KEY_SWEDENCENTRAL_AZURE_AI: REPLACE_ME
  AZURE_OPENAI_KEY_POLANDCENTRAL_AZUREAI_SERVICE: REPLACE_ME
  AZURE_OPENAI_KEY_SOUTHCENTRALUS_AZUREAI_SERVICE: REPLACE_ME

  # Microsoft Foundry 的 Anthropic 面。**与上面的 Azure OpenAI key 不是同一把** ——
  # 同一个资源的两个面各有各的凭据与鉴权头，合并会让 per-key allowlist 无法表达
  # 「Foundry 上允许 gpt 但不允许 Claude」。
  AZURE_ANTHROPIC_KEY_EASTUS2_FOUNDRY: REPLACE_ME

  # 用 MySQL 账本时必填（provider 归因需要该后端）。JSON 后端不需要。
  # MYSQL_PASSWORD: REPLACE_ME

  # 备用：如果 ConfigMap 里改用 env 方式注入 GitHub token，把下行解开并填值
  # （键名 = GITHUB_COPILOT_TOKEN_<账户名大写>）
  # GITHUB_COPILOT_TOKEN_GH_ACCOUNT_1: REPLACE_ME

  # Dashboard「密钥与渠道」页的解锁密码。**≥12 字符**，否则面板登录整体不可用
  # （回落到用 LB_API_KEY 解锁），绝不退化为无密码放行。它换到一个 HttpOnly 会话
  # cookie，所以页面脚本不持有任何凭据。解开下行并填值即可启用：
  # LB_DASHBOARD_PASSWORD: REPLACE_ME

  # 上游凭据封装密钥（base64 32 字节）。未配时 /admin/credentials 的录入返回 503，
  # 不会退化为存明文。生成：python3 -c "import base64,os;print(base64.b64encode(os.urandom(32)).decode())"
  # LB_CREDENTIAL_KEY: REPLACE_ME

---
# Copilot long-lived OAuth token 缓存文件，挂载到 /home/app/.config/databricks-claude-lb/
#
# 生成方式（在你本地一次性跑）：
#   python main.py --copilot-login --endpoint gh-account-1
#   # 然后会得到 ~/.config/databricks-claude-lb/copilot-auth-gh-account-1.json
#
# 把内容复制到这里（注意保留 stringData 字段名一致）；或用命令式：
#   kubectl create secret generic claude-lb-copilot-cache \
#     --from-file=copilot-auth-gh-account-1.json=$HOME/.config/databricks-claude-lb/copilot-auth-gh-account-1.json
#
# Token rotation 流程（无需重启 Pod）：
#   1) 本地重新跑 --copilot-login 拿新 token
#   2) kubectl create secret generic claude-lb-copilot-cache --from-file=... --dry-run=client -o yaml | kubectl apply -f -
#   3) 等 ≤1 min（kubelet 同步周期）或调 POST /admin/copilot/reload 立刻生效
#
# ⚠️ 名字与 key 的硬约束：
#   - secret 名以本文件为准 = claude-lb-copilot-cache（deployment.yaml 引用它）
#   - **key 必须叫 copilot-auth-<endpoint-name>.json**，endpoint-name 取
#     ConfigMap 里 github_copilot.endpoints[].name。挂载后容器内路径是
#     /home/app/.config/databricks-claude-lb/copilot-auth-<name>.json，
#     resolve_github_token() 按这个路径找（main.py:5232 _copilot_local_auth_path）。
#     key 名写错 → 文件名不对 → 静默回落到「无 token」，endpoint 起不来。
#   - live 集群 zeno-apps 用的是 `claude-lb-copilot-auth`（卷名 `copilot-auth-accounts`，
#     已挂载并在用），不是本文件这个名字。2026-10-18 实测：5 个账户里 4 个的 token 从
#     这里按上述文件名约定解析成功，第 5 个（ZenoRewn）走 env。详见
#     docs/AKS.md「live 与 repo 漂移」。
apiVersion: v1
kind: Secret
metadata:
  name: claude-lb-copilot-cache
  labels:
    app: claude-lb
type: Opaque
stringData:
  copilot-auth-gh-account-1.json: |
    {"github_token":"REPLACE_ME","saved_at":0}
