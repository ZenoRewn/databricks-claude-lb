name: tests

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  pytest:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12", "3.13"]

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          # 生产依赖 + 测试依赖（pytest 用于 subtest 输出；anyio 用于 async 测试）
          pip install -r requirements.txt
          pip install pytest pytest-subtests anyio

      - name: Show environment
        run: |
          python --version
          pip list

      - name: Run pytest
        # 显式跳过 fixtures/revision2 —— 那些是 unittest 独立跑的取证 fixture，
        # 会全局替换 root logger handler 破坏 caplog（详见 tests/fixtures/revision2/conftest.py）
        run: |
          python -m pytest tests/ -q --tb=short
