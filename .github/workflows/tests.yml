name: tests

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  pytest:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12", "3.13"]

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          # 生产依赖 + 测试依赖（pytest 用于 subtest 输出；anyio 用于 async 测试）
          pip install -r requirements.txt
          pip install pytest pytest-subtests anyio

      - name: Show environment
        run: |
          python --version
          pip list

      - name: Run pytest
        # 显式跳过 fixtures/revision2 —— 那些是 unittest 独立跑的取证 fixture，
        # 会全局替换 root logger handler 破坏 caplog（详见 tests/fixtures/revision2/conftest.py）
        run: |
          python -m pytest tests/ -q --tb=short

  docker-smoke:
    # 防"拆模块 vs 改 Dockerfile 脱钩"回归：镜像必须能 import main。
    # 2026-09-08 lb-dockerfile-gap 教训：refactor 拆出 usage_store.py /
    # otel_setup.py / dashboard.html 后 Dockerfile 忘了同步 COPY，只 COPY main.py
    # → 生产 CrashLoopBackOff（ModuleNotFoundError: usage_store）。
    # 这一步只跑一次，Python 版本无关，用最新稳定即可。
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build image
        run: docker build -t lb-smoke .
      - name: Import smoke — module & runtime assets present
        run: |
          docker run --rm --entrypoint sh lb-smoke -c '
            set -e
            cd /app
            # 首先所有已拆模块/资源必须都在镜像里
            for f in main.py usage_store.py otel_setup.py dashboard.html; do
              [ -f "$f" ] || { echo "MISSING: $f"; exit 1; }
            done
            # 其次 main.py 顶层能 import，OSErr 不降级隐藏
            python -c "import main; print(\"import OK: main.py\")"
            python -c "import usage_store; print(\"import OK: usage_store\")"
            python -c "import otel_setup; print(\"import OK: otel_setup\")"
          '

      - name: Runtime asset integrity — dashboard is the real page, not the fallback
        # 上一步只保证「文件在 + import 过」。dashboard.html 是 import 时读的，
        # _load_dashboard_html() 的 except OSError 只抓打不开，抓不到「打开了但
        # 内容被截断/损坏」——那种情况 /health/live 和 /health/ready 依然全绿，
        # 只有人肉打开 dashboard 才会发现是空壳。这里用语义哨兵而不是只看长度，
        # 因为长度阈值会被正常重构打破。
        run: |
          docker run --rm --entrypoint sh lb-smoke -c '
            set -e
            cd /app
            python - <<PY
          import main
          h = main.DASHBOARD_HTML
          assert "Dashboard unavailable" not in h, "dashboard degraded to fallback placeholder"
          assert h.lstrip().startswith("<!DOCTYPE html>"), "dashboard missing doctype"
          assert h.rstrip().endswith("</html>"), "dashboard truncated (no closing </html>)"
          # 文件末尾的 bootstrap 段：截断时最先丢的就是它
          assert "setInterval(refresh" in h, "dashboard bootstrap missing"
          # 主题切换与 Chart.js 主题同步是核心交互，缺了说明内容不完整
          assert "applyChartTheme" in h, "dashboard theme sync missing"
          assert len(h) > 20000, f"dashboard suspiciously small: {len(h)} chars"
          print(f"dashboard OK: {len(h)} chars")
          PY
          '
